name: C# port

on:
  push:
    paths:
      - "ports/csharp/**"
      - "spec/**"
      - ".github/workflows/csharp-port.yml"
  pull_request:
    paths:
      - "ports/csharp/**"
      - "spec/**"
      - ".github/workflows/csharp-port.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: ports/csharp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x
      - name: Zero dependencies
        shell: bash
        run: |
          if grep -rEn "<(PackageReference|PackageVersion)|<FrameworkReference" --include="*.csproj" --include="*.props" --include="*.targets" .; then
            echo "ERROR: a package or framework reference was found; the port must use only the BCL."
            exit 1
          fi
          test ! -e packages.lock.json && test ! -e NuGet.config && test ! -e nuget.config || { echo "ERROR: NuGet config or lock file present"; exit 1; }
          echo "OK: no package references."
      - name: Build
        run: dotnet build Nakedagent.Tests -c Release --nologo
      - name: Conformance vectors
        run: dotnet run --project Nakedagent.Tests -c Release --no-build --nologo
