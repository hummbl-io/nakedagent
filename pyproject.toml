[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nakedagent"
version = "0.1.0"
description = "A coding agent with zero runtime dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
nakedagent = "nakedagent.cli:main"

[project.urls]
Repository = "https://github.com/hummbl-dev/nakedagent"

[tool.setuptools.packages.find]
include = ["nakedagent*"]
